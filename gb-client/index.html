<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c0a09" />
  <meta name="color-scheme" content="dark light" />

  <!-- Apply the saved theme before anything paints (night is the default),
       so the page never flashes light first. Keep in sync with
       src/theme/ThemeProvider.tsx. -->
  <script>
    (function () {
      var theme = "dark";
      try {
        var saved = localStorage.getItem("gb-theme");
        if (saved === "light" || saved === "dark") theme = saved;
      } catch (e) {}
      var root = document.documentElement;
      if (theme === "dark") root.classList.add("dark");
      root.style.colorScheme = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "dark" ? "#0c0a09" : "#fafaf9");
    })();
  </script>

  <!-- Primary Meta Tags -->
  <title>Grontho Bilash | Buy & Sell Old Books Online</title>
  <meta name="title" content="Grontho Bilash | Buy & Sell Old Books Online" />
  <meta name="description"
    content="Discover your next great read at Grontho Bilash. Explore a wide collection of books, literature, and more." />
  <meta name="keywords" content="books, bookstore, online bookshop, Grontho Bilash, literature, reading" />
  <meta name="author" content="Grontho Bilash" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.gronthobilash.com/" />
  <meta property="og:title" content="Grontho Bilash | Buy & Sell Old Books Online" />
  <meta property="og:description"
    content="Discover your next great read at Grontho Bilash. Explore a wide collection of books, literature, and more." />
  <meta property="og:image" content="https://www.gronthobilash.com/logo.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:url" content="https://www.gronthobilash.com/" />
  <meta property="twitter:title" content="Grontho Bilash | Buy & Sell Old Books Online" />
  <meta property="twitter:description"
    content="Discover your next great read at Grontho Bilash. Explore a wide collection of books, literature, and more." />
  <meta property="twitter:image" content="https://www.gronthobilash.com/logo.png" />

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="/logo.png" />
  <link rel="canonical" href="https://www.gronthobilash.com/" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Baloo+Da+2:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap"
    rel="stylesheet">
</head>

<body class="apercu-bold">
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
