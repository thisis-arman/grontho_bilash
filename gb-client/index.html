<!doctype html>
<html lang="bn">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0c0a09" />
  <meta name="color-scheme" content="dark light" />

  <!-- Apply the saved theme before anything paints (night is the default),
       so the page never flashes light first. Keep in sync with
       src/theme/ThemeProvider.tsx. -->
  <script>
    (function () {
      var theme = "dark";
      try {
        var saved = localStorage.getItem("gb-theme");
        if (saved === "light" || saved === "dark") theme = saved;
      } catch (e) {}
      var root = document.documentElement;
      if (theme === "dark") root.classList.add("dark");
      root.style.colorScheme = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "dark" ? "#0c0a09" : "#fafaf9");
    })();
  </script>

  <!-- Defaults for the home page. Every other page replaces the title,
       description, canonical URL and share tags for itself
       (src/utils/usePageMeta.ts), so there is deliberately no fixed
       canonical here: in a single-page app it would mark every URL as a
       copy of the home page. -->
  <title>Grontho Bilash – Buy &amp; Sell Used Books in Bangladesh</title>
  <meta name="description"
    content="Buy used textbooks and books for less, sell the ones you have finished, and get free exam suggestions, notes and student tools. Delivery across Bangladesh." />
  <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1" />
  <meta name="application-name" content="Grontho Bilash" />
  <meta name="apple-mobile-web-app-title" content="Grontho Bilash" />
  <!-- Installable app (see public/site.webmanifest and public/sw.js). -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- Open Graph (Facebook, WhatsApp, LinkedIn) -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Grontho Bilash" />
  <meta property="og:locale" content="bn_BD" />
  <meta property="og:locale:alternate" content="en_US" />
  <meta property="og:url" content="https://www.gronthobilash.com/" />
  <meta property="og:title" content="Grontho Bilash – Buy &amp; Sell Used Books in Bangladesh" />
  <meta property="og:description"
    content="Buy used textbooks for less, sell the ones you have finished, and get free exam suggestions and student tools." />
  <meta property="og:image" content="https://www.gronthobilash.com/og-image.jpg" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Grontho Bilash – buy and sell used books in Bangladesh" />

  <!-- X / Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Grontho Bilash – Buy &amp; Sell Used Books in Bangladesh" />
  <meta name="twitter:description"
    content="Buy used textbooks for less, sell the ones you have finished, and get free exam suggestions and student tools." />
  <meta name="twitter:image" content="https://www.gronthobilash.com/og-image.jpg" />
  <meta name="twitter:image:alt" content="Grontho Bilash – buy and sell used books in Bangladesh" />

  <!-- Icons (generated by scripts/generate-icons.ps1) -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/site.webmanifest" />

  <!-- Start connecting early to the hosts every page needs. Fonts are
       self-hosted (see src/index.css), so there is no Google Fonts request. -->
  <link rel="preconnect" href="https://grontho-bilash-server.vercel.app" crossorigin />
  <link rel="preconnect" href="https://res.cloudinary.com" />

  <!-- Structured data: who we are, and site search (lets Google show a
       search box for the site in results). -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "@id": "https://www.gronthobilash.com/#organization",
          "name": "Grontho Bilash",
          "alternateName": "গ্রন্থবিলাস",
          "url": "https://www.gronthobilash.com/",
          "logo": "https://www.gronthobilash.com/icon-512.png",
          "email": "hello@gronthobilash.com",
          "address": { "@type": "PostalAddress", "addressLocality": "Dhaka", "addressCountry": "BD" },
          "contactPoint": {
            "@type": "ContactPoint",
            "telephone": "+8801883350118",
            "contactType": "customer service",
            "areaServed": "BD",
            "availableLanguage": ["bn", "en"]
          }
        },
        {
          "@type": "WebSite",
          "@id": "https://www.gronthobilash.com/#website",
          "url": "https://www.gronthobilash.com/",
          "name": "Grontho Bilash",
          "alternateName": "গ্রন্থবিলাস",
          "inLanguage": ["bn", "en"],
          "publisher": { "@id": "https://www.gronthobilash.com/#organization" },
          "potentialAction": {
            "@type": "SearchAction",
            "target": {
              "@type": "EntryPoint",
              "urlTemplate": "https://www.gronthobilash.com/books?search={search_term_string}"
            },
            "query-input": "required name=search_term_string"
          }
        }
      ]
    }
  </script>
</head>

<body class="apercu-bold">
  <div id="root"></div>

  <!-- Shown to visitors and crawlers that don't run JavaScript. -->
  <noscript>
    <main style="max-width:640px;margin:48px auto;padding:0 16px;font-family:system-ui,sans-serif;line-height:1.6">
      <h1>Grontho Bilash – Buy &amp; Sell Used Books in Bangladesh</h1>
      <p>Buy used textbooks and books for less, sell the ones you have finished, and get free exam suggestions,
        notes and student tools. Please enable JavaScript to use the site.</p>
      <ul>
        <li><a href="/books">Browse books</a></li>
        <li><a href="/suggestions">Exam suggestions</a></li>
        <li><a href="/blogs">Blog</a></li>
        <li><a href="/tools">Student tools</a></li>
        <li><a href="/about">About us</a></li>
      </ul>
    </main>
  </noscript>

  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
