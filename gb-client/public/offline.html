<!doctype html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0c0a09" />
  <title>ইন্টারনেট সংযোগ নেই | Grontho Bilash</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: #0c0a09; color: #fafaf9;
      font-family: "Hind Siliguri", system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { max-width: 420px; text-align: center; }
    img { width: 64px; height: 64px; }
    h1 { margin: 20px 0 8px; font-size: 26px; line-height: 1.3; }
    p { margin: 0 0 24px; color: #a8a29e; line-height: 1.7; }
    button {
      height: 48px; padding: 0 28px; border: 0; border-radius: 12px; cursor: pointer;
      background: #fbbf24; color: #1c1917; font: inherit; font-weight: 700;
    }
  </style>
</head>
<body>
  <main>
    <img src="/logo-96.png" alt="Grontho Bilash" width="64" height="64" />
    <h1>ইন্টারনেট সংযোগ নেই</h1>
    <p>মনে হচ্ছে তুমি এখন অফলাইনে আছ। সংযোগ ফিরে এলে আবার চেষ্টা করো।</p>
    <button type="button" onclick="location.reload()">আবার চেষ্টা করো</button>
  </main>
  <script>window.addEventListener("online", function () { location.reload(); });</script>
